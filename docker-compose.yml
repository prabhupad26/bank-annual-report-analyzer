services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bank_reports
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_reports"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
